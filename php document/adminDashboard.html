        width: 100%;

      table,

        border: 1px solid #ddd;

  <body>
    <div class="preloader js-preloader">
      <div></div>
    </div>

    <div class="page-wrapper">
      <header class="header js-header">
        <div class="container">
          <div class="logo" data-aos="fade-down" data-aos-duration="1000">
            <a href="#">BrightWave <span>Cleaners</span></a>
          </div>
          <button
            type="button"
            class="nav-toggler js-nav-toggler"
            data-aos="fade-down"
            data-aos-duration="1000"
          >
            <span></span>
          </button>
          <nav class="nav js-nav">
            <ul data-aos="fade-down" data-aos-duration="1000">
              <li><a href="#home">Home</a></li>
              <li><a href="#about">About</a></li>
              <li><a href="#services">Services</a></li>
              <li><a href="#pricing">Pricing</a></li>
              <li><a href="#team">Team</a></li>
              <li><a href="#contact">Contact</a></li>
              <li><a href="login.html" class="login-btn">Login &#8594;</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <div class="container">
        <h1>Admin Dashboard</h1>
        <button id="showAdmin">Show Admin</button>
        <button id="showUser">Show User</button>
        <button id="showBookService">Show BookService</button>
        <button id="showService">Show Feedback-Details</button>
        <div id="dataContainer" style="display: contents"></div>
        <div id="detailsContainer"></div>
      </div>
    </div>

    <script>
      document
        .getElementById("showAdmin")
        .addEventListener("click", function () {
          fetchData("adminlogin.php");
        });

      document
        .getElementById("showUser")
        .addEventListener("click", function () {
          fetchData("showUser.php");
        });

      document
        .getElementById("showBookService")
        .addEventListener("click", function () {
          fetchData("admindashboard.php");
        });

      document
        .getElementById("showService")
        .addEventListener("click", function () {
          fetchData("showFeedback.php");
        });

      function fetchData(url) {
        $.ajax({
          url: url,
          method: "GET",
          success: function (data) {
            $("#dataContainer").html(data);
            // $('#dataContainer').show();
            // $('#detailsContainer').hide();
          },
          error: function () {
            $("#dataContainer").html("<p>An error has occurred</p>");
          },
        });
      }

      function fetchDetails(url) {
        $.ajax({
          url: url,
          method: "GET",
          success: function (data) {
            $("#detailsContainer").html(data);
            // $('#dataContainer').hide();
            // $('#detailsContainer').show();
          },
          error: function () {
            $("#detailsContainer").html("<p>An error has occurred</p>");
          },
        });
      }
    </script>
